name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strip Wix banner from HTML
        run: |
          find site -name "*.html" -exec sed -i 's|</head>|<style>#WIX_ADS { display: none !important; }</style></head>|g' {} +
          echo "Banner stripping complete"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4