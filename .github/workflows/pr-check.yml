name: pr-check
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint
        uses: azure/setup-helm@v4
      - run: helm lint helm/elmira-site
      - name: Build image
        run: docker build -t elmira-site:pr .
