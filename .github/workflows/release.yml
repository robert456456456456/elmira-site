name: release
on:
  push:
    branches: [main]
    paths-ignore:
      - "helm/elmira-site/values.yaml"
      - "helm/elmira-site/Chart.yaml"
      - "**.md"
permissions:
  contents: write
  id-token: write
env:
  PROJECT: solid-heaven-334106
  REGION: us-central1
  AR_REPO: elmira
  IMAGE: elmira-site
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/583163478840/locations/global/workloadIdentityPools/github-pool/providers/github-provider-elmira
          service_account: github-elmira@solid-heaven-334106.iam.gserviceaccount.com
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build and push
        id: build
        run: |
          TAG=${{ steps.tag.outputs.new_tag }}
          IMG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE }}
          docker build -t $IMG:$TAG -t $IMG:latest .
          docker push $IMG:$TAG
          docker push $IMG:latest
      - name: Bump chart to new image tag
        run: |
          TAG=${{ steps.tag.outputs.new_tag }}
          sed -i "s|^  tag: .*|  tag: $TAG|" helm/elmira-site/values.yaml
          sed -i "s|^appVersion: .*|appVersion: \"$TAG\"|" helm/elmira-site/Chart.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/elmira-site/values.yaml helm/elmira-site/Chart.yaml
          git commit -m "chore: release $TAG [skip ci]" || exit 0
          git push origin main
