server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter '</head>' '<style>#WIX_ADS,#WIX_ADS *{display:none!important;height:0!important;min-height:0!important;max-height:0!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;visibility:hidden!important}#SITE_CONTAINER{margin-top:0!important;padding-top:0!important}</style></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
